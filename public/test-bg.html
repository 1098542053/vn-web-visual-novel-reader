<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背景图功能自动测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; color: #c8c8d4; font-family: 'Consolas','Courier New',monospace; padding: 20px; }
  h1 { color: #8af; border-bottom: 1px solid #334; padding-bottom: 8px; margin-bottom: 16px; font-size: 18px; }
  h1 span { color: #6a6; font-size: 13px; }
  #controls { margin-bottom: 16px; }
  #controls button { background: #1a1a2e; color: #8af; border: 1px solid #335; padding: 8px 20px; cursor: pointer; font-family: inherit; font-size: 14px; }
  #controls button:hover { background: #2a2a44; border-color: #8af; }
  #controls button:disabled { opacity: .5; cursor: default; }
  #controls .status { display: inline-block; margin-left: 16px; color: #888; }
  #stats { display: flex; gap: 20px; margin-bottom: 16px; font-size: 13px; }
  #stats .stat-box { background: #111122; border: 1px solid #223; padding: 8px 14px; min-width: 100px; }
  #stats .stat-box .num { font-size: 22px; font-weight: bold; }
  #stats .stat-box .label { color: #888; font-size: 11px; }
  #stats .stat-box.pass .num { color: #6a6; }
  #stats .stat-box.fail .num { color: #c66; }
  #stats .stat-box.total .num { color: #8af; }
  #log { background: #08081a; border: 1px solid #1a1a30; padding: 12px; height: 400px; overflow-y: auto; font-size: 12px; line-height: 1.6; }
  #log .pass { color: #6a6; }
  #log .fail { color: #c66; }
  #log .info { color: #88a; }
  #log .warn { color: #ca6; }
  #log .time { color: #446; margin-right: 6px; }
  #preview { display: none; margin-top: 12px; border: 1px solid #223; width: 640px; height: 360px; background: #111; position: relative; overflow: hidden; }
  #preview canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<h1>&#128247; 背景图功能自动测试 <span>检测图片加载、图像显示、分辨率</span></h1>
<div id="controls">
  <button id="btnStart" onclick="startTest()">&#9654; 开始测试</button>
  <span class="status" id="statusText">就绪</span>
</div>
<div id="stats">
  <div class="stat-box total"><div class="num" id="statTotal">0</div><div class="label">总 BG</div></div>
  <div class="stat-box pass"><div class="num" id="statPass">0</div><div class="label">通过</div></div>
  <div class="stat-box fail"><div class="num" id="statFail">0</div><div class="label">失败</div></div>
  <div class="stat-box"><div class="num" id="statRatio">-</div><div class="label">16:9 比例</div></div>
</div>
<div id="log"></div>
<div id="preview"><canvas id="previewCanvas" width="640" height="360"></canvas></div>

<script>
var bgList = [
  'bg001_10','bg001_30','bg002_10','bg002_31','bg003_10','bg003_30','bg004_10','bg005_10','bg005_30',
  'bg005_31','bg006_10','bg007_10','bg007_30','bg008_10','bg008_30','bg009_10','bg010_10','bg010_30',
  'bg010_31','bg010_32','bg011_10','bg012_10','bg013_10','bg014_10','bg015_10','bg015_30','bg015_31',
  'bg016_10','bg016_30','bg017_10','bg017_30','bg018_10','bg018_30','bg019_10','bg020_10','bg020_11',
  'bg020_12','bg020_33','bg020_34','bg020_35','bg020_36','bg020_37','bg020_38','bg021_10','bg021_11',
  'bg022_10','bg022_11','bg022_12','bg023_10','bg023_20','bg024_10','bg025_10','bg026_10','bg026_30',
  'bg027_10','bg028_10','bg028_11','bg029_10','bg031_30','bg031_31','bg033_10','bg033_13','bg036_10',
  'bg036_12','bg037_10','bg038_12','bg039_10','bg039_30','bg040_10','bg040_30','bg041_10','bg041_30',
  'bg042_10','bg043_10','bg044_10','bg044_11','bg045_31','bg045_32','bg045_33','bg047_10','bg049_10',
  'bg050_11','bg051_10','bg052_10','bg052_30','bg054_10','bg056_10','bg056_30','bg058_30','bg059_30',
  'bg059_31','bg059_32','bg063_10','bg064_10','bg065_10','bg066_10','bg067_10','bg069_10','bg075_31',
  'bg076_10','bg076_30','bg077_10','bg078_10','bg078_30','bg082_10','bg083_10','bg084_10','bg085_10',
  'bg086_10','bg087_10','bg098_10','bg101_10','bg101_30','bg102_10','bg102_11','bg102_30','bg103_10',
  'bg103_30','bg104_10','bg104_30','bg105_10','bg105_30','bg105_31','bg106_10','bg107_10','bg107_30',
  'bg107_38','bg108_10','bg108_30','bg109_10','bg110_10','bg110_30','bg111_10','bg111_30','bg111_31',
  'bg112_10','bg113_10','bg113_30','bg114_10','bg115_10','bg116_10','bg117_10','bg117_30','bg118_30',
  'bg119_10','bg119_30','bg119_31','bg120_10','bg120_30','bg121_10','bg121_30','bg122_10','bg122_30',
  'bg123_10','bg124_11','bg124_30','bg125_10','bg126_10','bg126_11','bg127_10','bg127_30','bg128_30',
  'bg129_30','bg130_30','bg131_10','bg132_10','bg133_10','bg134_10','bg135_10','bg136_10','bg136_30',
  'bg136_38','bg137_10','bg137_30','bg138_10','bg139_10','bg140_10','bg141_10','bg141_30','bg142_20',
  'bg143_10','bg145_30','bg146_30','bg147_10','bg148_10','bg149_10','bg149_30','bg150_10','bg151_10',
  'bg151_11','bg151_30','bg152_30','bg153_10','bg153_30','bg154_30','bg155_10','bg156_30','bg157_10',
  'bg157_30','bg158_10','bg159_10','bg160_31','bg161_10','bg165_10','bg166_10','bg168_10','bg169_10',
  'bg170_10','bg171_30','bg172_30','bg173_10','bg178_30','bg180_10','bg180_11','bg210_30','bg211_30'
];
var totalPass = 0, totalFail = 0;
var logEl = document.getElementById('log');
var previewCanvas = document.getElementById('previewCanvas');
var previewCtx = previewCanvas.getContext('2d');

function log(msg, cls) {
  var t = new Date();
  var ts = t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0') + ':' + t.getSeconds().toString().padStart(2,'0');
  logEl.innerHTML += '<div class="' + (cls||'info') + '"><span class="time">[' + ts + ']</span>' + msg + '</div>';
  logEl.scrollTop = logEl.scrollHeight;
}

function updateStats() {
  document.getElementById('statTotal').textContent = bgList.length;
  document.getElementById('statPass').textContent = totalPass;
  document.getElementById('statFail').textContent = totalFail;
}

function setStatus(text) {
  document.getElementById('statusText').textContent = text;
}

function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

// 加载图片到canvas并检测像素
function loadAndCheckImage(url) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      // 检查分辨率
      var w = img.naturalWidth, h = img.naturalHeight;
      var ratio = w / h;
      var isPowerOfTwo = (w & (w - 1)) === 0 && (h & (h - 1)) === 0;

      // 渲染到canvas检测像素
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      previewCtx.drawImage(img, 0, 0, previewCanvas.width, previewCanvas.height);
      var imageData = previewCtx.getImageData(0, 0, previewCanvas.width, previewCanvas.height);
      var pixels = imageData.data;
      var totalPixels = pixels.length / 4;
      var nonBlack = 0;
      var rSum = 0, gSum = 0, bSum = 0;
      for (var i = 0; i < pixels.length; i += 4) {
        rSum += pixels[i]; gSum += pixels[i+1]; bSum += pixels[i+2];
        if (pixels[i] > 10 || pixels[i+1] > 10 || pixels[i+2] > 10) nonBlack++;
      }
      var avgR = rSum / totalPixels, avgG = gSum / totalPixels, avgB = bSum / totalPixels;
      var hasContent = nonBlack > totalPixels * 0.05; // 至少5%非纯黑像素

      resolve({
        width: w, height: h, ratio: ratio,
        isPowerOfTwo: isPowerOfTwo,
        avgR: avgR, avgG: avgG, avgB: avgB,
        hasContent: hasContent,
        nonBlackPercent: (nonBlack / totalPixels * 100).toFixed(1)
      });
    };
    img.onerror = function() { resolve(null); };
    img.src = url;
  });
}

async function startTest() {
  var btn = document.getElementById('btnStart');
  btn.disabled = true;
  totalPass = 0; totalFail = 0;
  logEl.innerHTML = '';
  updateStats();
  setStatus('测试中...');
  document.getElementById('preview').style.display = 'block';

  log('========================================', 'info');
  log('背景图功能自动测试开始', 'info');
  log('BG 总数: ' + bgList.length, 'info');
  log('========================================', 'info');

  // 统计
  var ratioOk = 0, ratioFail = 0;
  var pow2Ok = 0, pow2Fail = 0;
  var contentOk = 0, contentFail = 0;

  // 分批测试，避免并发太多
  var batchSize = 5;
  for (var i = 0; i < bgList.length; i += batchSize) {
    var batch = bgList.slice(i, i + batchSize);
    var promises = batch.map(function(name) {
      return loadAndCheckImage('/texture/BG/' + name + '.png');
    });
    var results = await Promise.all(promises);

    for (var j = 0; j < batch.length; j++) {
      var name = batch[j];
      var result = results[j];
      if (result === null) {
        log('FAIL: ' + name + '.png 加载失败 (404)', 'fail');
        totalFail++;
        contentFail++;
        updateStats();
        continue;
      }

      // 检测1: 是否有图像内容
      var contentPass = result.hasContent;
      if (contentPass) contentOk++; else contentFail++;

      // 检测2: 16:9 比例检查 (允许误差)
      var expectedRatio = 16/9;
      var ratioError = Math.abs(result.ratio - expectedRatio) / expectedRatio;
      var isRatioOk = ratioError < 0.15; // 允许15%误差
      if (isRatioOk) ratioOk++; else ratioFail++;

      // 检测3: 是否为2的幂 (GPU优化)
      if (result.isPowerOfTwo) pow2Ok++; else pow2Fail++;

      var status = (contentPass ? 'PASS' : 'FAIL') + ' | ' + name +
        ' [' + result.width + 'x' + result.height + ']' +
        ' 比例=' + result.ratio.toFixed(3) +
        ' 内容=' + result.nonBlackPercent + '%' +
        ' 平均RGB=(' + result.avgR.toFixed(0) + ',' + result.avgG.toFixed(0) + ',' + result.avgB.toFixed(0) + ')' +
        ' 2的幂=' + (result.isPowerOfTwo ? '是' : '否');

      if (contentPass) {
        log(status, 'pass');
        totalPass++;
      } else {
        log(status, 'fail');
        totalFail++;
      }
      updateStats();
      await sleep(20);
    }
  }

  // 总结
  log('========================================', 'info');
  log('测试完成', 'info');
  log('通过: ' + totalPass + ' | 失败: ' + totalFail, 'info');
  log('--- 详细统计 ---', 'info');
  log('图像内容: 有内容=' + contentOk + ' 无内容=' + contentFail, contentFail > 0 ? 'warn' : 'info');
  log('16:9比例: 符合=' + ratioOk + ' 不符合=' + ratioFail, ratioFail > 0 ? 'warn' : 'info');
  log('2的幂: 是=' + pow2Ok + ' 否=' + pow2Fail, pow2Fail > 0 ? 'warn' : 'info');
  document.getElementById('statRatio').textContent = ratioOk + '/' + bgList.length;
  log('========================================', 'info');

  updateStats();
  setStatus('测试完成 - 通过: ' + totalPass + ', 失败: ' + totalFail);
  btn.disabled = false;
}
</script>
</body>
</html>
