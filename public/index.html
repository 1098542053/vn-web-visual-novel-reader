<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>VN-Reader - Visual Novel Reader</title><link rel="stylesheet" href="css/style.css"><style>.reader-bg{position:absolute!important;inset:0!important;background:#0a0a14!important;overflow:hidden!important;display:flex!important;align-items:center!important;justify-content:center!important}.reader-bg-16-9{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);overflow:hidden;flex-shrink:0}.reader-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;background:#0a0a14}.reader-sprite{position:absolute;inset:0;z-index:1;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}.sprite-layer{position:absolute;bottom:0;height:90%;object-fit:contain;opacity:1;transition:opacity .3s}.dialog-headicon{width:64px;height:64px;border:1px solid var(--border);margin-right:.8rem;flex-shrink:0;object-fit:cover;display:none}.dialog-headicon[src]{display:block}.dialog-row{display:flex;align-items:flex-start}.char-card{display:flex;align-items:center;gap:.8rem}.char-card-img{width:64px;height:64px;object-fit:cover;border:1px solid var(--border)}.char-card-info{flex:1}.select-panel{display:flex;flex-direction:column;align-items:center;gap:1.5rem;padding:2rem;flex:1;justify-content:center}.select-btn{position:relative;width:280px;height:200px;border:2px solid var(--border);cursor:pointer;overflow:hidden;transition:all .2s;display:flex;align-items:center;justify-content:center;background:var(--bg-card)}.select-btn:hover{border-color:var(--accent-dim)}.select-btn-img{width:100%;height:100%;object-fit:cover;opacity:.7}.select-btn:hover .select-btn-img{opacity:.9}.select-btn-label{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:.5rem;background:rgba(10,10,18,.85);color:var(--accent);font-size:1rem;letter-spacing:.2em;border-top:1px solid var(--border)}.reader-hide-btn{background:none;border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-main);font-size:.9rem;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-left:auto;flex-shrink:0}.reader-hide-btn:hover{border-color:var(--accent);color:var(--accent)}.reader-ui-hidden .reader-top-bar,.reader-ui-hidden .reader-dialog,.reader-ui-hidden .reader-controls{display:none!important}.reader-dialog{position:relative;z-index:3;background:linear-gradient(to top,rgba(10,10,18,.97) 0%,rgba(10,10,18,.92) 100%);border-top:1px solid var(--border);padding:1rem 1.5rem;min-height:180px;user-select:none;-webkit-user-select:none}.dialog-name{font-size:.85rem;color:var(--accent);margin-bottom:.5rem}
/* Review Panel */.review-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center}.review-overlay.active{display:flex}.review-panel{background:var(--bg-panel);border:1px solid var(--border);width:90%;max-width:700px;max-height:80vh;display:flex;flex-direction:column}.review-header{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--border);color:var(--accent);font-size:.9rem}.review-content{flex:1;overflow-y:auto;padding:.5rem 1rem;max-height:60vh}.review-content::-webkit-scrollbar{width:11px}.review-item{display:flex;gap:.8rem;padding:.6rem 0;border-bottom:1px solid rgba(42,42,62,0.5);cursor:pointer;align-items:flex-start}.review-item:last-child{border-bottom:none}.review-item-head{flex-shrink:0;width:48px;height:48px}.review-item-headicon{width:48px;height:48px;object-fit:cover;border:1px solid var(--border)}.review-item-body{flex:1;min-width:0}.review-item-speaker{font-size:.75rem;color:var(--accent);margin-bottom:.2rem}.review-item-text{font-size:.85rem;color:var(--text-bright);line-height:1.6;white-space:pre-wrap;word-wrap:break-word;user-select:none;-webkit-user-select:none}.review-item-voice-btn{flex-shrink:0;width:32px;height:32px;background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:4px}.review-item-voice-btn:hover{border-color:var(--accent);color:var(--accent)}
/* Language Options */.lang-options{display:flex;gap:1rem;flex-wrap:wrap}.lang-options label{font-size:.8rem;cursor:pointer;color:var(--text-dim);display:flex;align-items:center;gap:.3rem}.lang-options input{accent-color:var(--accent)}</style></head><body><div id="app"><div id="screen-title" class="screen active"><div class="title-bg"></div><div class="title-content"><h1 class="title-logo">VN-READER</h1><p class="title-subtitle">Visual Novel Scenario Reader</p><div class="title-menu"><button class="title-btn" onclick="navigateTo('characters')"><span class="btn-bracket">[</span> <span data-i18n="title.characters">角色劇情</span> <span class="btn-bracket">]</span></button><button class="title-btn" onclick="navigateTo('main-story')"><span class="btn-bracket">[</span> <span data-i18n="title.mainStory">主線故事</span> <span class="btn-bracket">]</span></button><button class="title-btn" onclick="navigateTo('events')"><span class="btn-bracket">[</span> <span data-i18n="title.events">事件劇情</span> <span class="btn-bracket">]</span></button><button class="title-btn" onclick="navigateTo('gallery')"><span class="btn-bracket">[</span> <span>回憶畫廊</span> <span class="btn-bracket">]</span></button><button class="title-btn" onclick="navigateTo('l2d-gallery')"><span class="btn-bracket">[</span> <span>模型畫廊</span> <span class="btn-bracket">]</span></button><button class="title-btn" onclick="navigateTo('settings')"><span class="btn-bracket">[</span> <span data-i18n="title.settings">設定</span> <span class="btn-bracket">]</span></button></div><p class="title-credit">Data from ExportedProject (AssetRipper)</p></div></div><div id="screen-characters" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2>角色列表</h2></div><div class="char-filter-bar"><input type="text" id="char-search" placeholder="搜尋角色..." oninput="filterCharacters()"><div class="filter-stars" id="filter-stars"><label><input type="checkbox" value="5" checked onchange="filterCharacters()"> ★5</label><label><input type="checkbox" value="4" checked onchange="filterCharacters()"> ★4</label><label><input type="checkbox" value="3" checked onchange="filterCharacters()"> ★3</label><label><input type="checkbox" value="2" checked onchange="filterCharacters()"> ★2</label><label><input type="checkbox" value="1" checked onchange="filterCharacters()"> ★1</label></div></div><div class="char-grid" id="char-grid"></div></div><div id="screen-story-list" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2 id="story-list-title">章節列表</h2></div><div class="story-list" id="story-list"></div></div><div id="screen-events" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2>事件劇情</h2></div><div class="event-grid" id="event-grid"></div></div><div id="screen-char-select" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('characters')">← 返回</button><h2 id="select-char-name">角色選擇</h2></div><div class="select-panel" id="char-select-panel"><div class="select-btn" id="btn-select-normal"><img class="select-btn-img"><span class="select-btn-label">Normal</span></div><div class="select-btn" id="btn-select-cg"><img class="select-btn-img"><span class="select-btn-label">R18/CG</span></div></div></div><div id="screen-settings" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2>設定</h2></div><div class="settings-panel"><div class="setting-item"><label data-i18n="settings.textSpeed">文字速度</label><input type="range" id="text-speed" min="10" max="100" value="40" oninput="updateSettings()"><span id="text-speed-label">中等</span></div><div class="setting-item"><label data-i18n="settings.autoDelay">自動模式延迟</label><input type="range" id="auto-delay" min="500" max="5000" step="100" value="2000" oninput="updateSettings()"><span id="auto-delay-label">2.0s</span></div><div class="setting-item"><label data-i18n="settings.fontSize">字體大小</label><input type="range" id="font-size" min="14" max="32" value="20" oninput="updateSettings()"><span id="font-size-label">20px</span></div><div class="setting-item"><label data-i18n="settings.language">語言</label><div class="lang-options"><label><input type="radio" name="lang" value="zh-TW" checked onchange="setLanguage('zh-TW')"> 繁體中文</label><label><input type="radio" name="lang" value="zh-CN" onchange="setLanguage('zh-CN')"> 简体中文</label><label><input type="radio" name="lang" value="ja" onchange="setLanguage('ja')"> 日本語</label></div></div><div class="setting-item"><label data-i18n="settings.aspectRatio">畫面比例</label><div class="lang-options"><label><input type="radio" name="aspect-ratio" value="16:9" checked onchange="updateSettings()"> 16:9</label><label><input type="radio" name="aspect-ratio" value="4:3" onchange="updateSettings()"> 4:3</label></div></div><div class="setting-item"><label data-i18n="settings.dialogOpacity">對話框透明度</label><input type="range" id="dialog-opacity" min="30" max="100" value="100" oninput="updateSettings()"><span id="dialog-opacity-label">100%</span></div><div class="setting-item"><label data-i18n="settings.reset">重置設定</label><button class="reset-btn" onclick="resetSettings()" data-i18n="settings.resetBtn">恢復預設</button></div></div></div><div id="screen-gallery" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2>回憶畫廊</h2></div><div class="gallery-grid" id="gallery-grid"></div><div class="gallery-pager" id="gallery-pager"></div><div id="cg-viewer" class="cg-viewer" style="display:none"><div class="cg-viewer-bg" onclick="closeCG()"></div><button class="cg-close-btn" onclick="closeCG()">← 返回</button><button class="cg-nav cg-prev" onclick="prevCG()">&lt;</button><div class="cg-viewer-slider" id="cg-viewer-slider"><div class="cg-slide-track" id="cg-slide-track"><div class="cg-slide" id="cg-slide"><div class="cg-slide-inner" id="cg-slide-inner"><img id="cg-image" style="display:none"><video id="cg-video" style="display:none" loop playsinline></video></div></div></div><button class="cg-nav cg-next" onclick="nextCG()">&gt;</button><div class="cg-info" id="cg-info"><span class="cg-char-name" id="cg-char-name"></span><div class="cg-dots" id="cg-dots"></div><span class="cg-counter" id="cg-counter"></span></div></div></div></div><div id="screen-l2d-gallery" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2>模型畫廊</h2></div><div class="l2d-grid" id="l2d-grid"></div><div class="l2d-pager" id="l2d-pager"></div><div id="l2d-viewer" class="l2d-viewer" style="display:none"><div class="l2d-viewer-bg" onclick="closeL2D()"></div><button class="l2d-close-btn" onclick="closeL2D()">← 返回</button><button class="l2d-nav l2d-prev" onclick="prevL2D()">&lt;</button><div class="l2d-canvas-wrap" id="l2d-canvas-wrap"><canvas id="l2d-canvas"></canvas><div class="l2d-loading" id="l2d-loading">載入中...</div></div><button class="l2d-nav l2d-next" onclick="nextL2D()">&gt;</button><div class="l2d-info" id="l2d-info"><span class="l2d-char-name" id="l2d-char-name"></span><span class="l2d-counter" id="l2d-counter"></span></div><div class="l2d-motions" id="l2d-motions"></div></div></div><div id="screen-reader" class="screen"><div class="reader-bg" id="reader-bg"><div class="reader-bg-16-9"><div class="reader-bg-color" id="reader-bg-color"></div><img class="reader-bg-img" id="reader-bg-img" style="display:none"><div class="reader-sprite" id="reader-sprite"><img class="sprite-layer" id="sprite-01"><img class="sprite-layer" id="sprite-02"><img class="sprite-layer" id="sprite-03"></div></div></div><div class="reader-top-bar"><button class="reader-btn" onclick="readerBack()"><span data-i18n="reader.back">← 返回</span></button><span class="reader-title" id="reader-title" data-i18n="reader.loading">讀取中...</span><button class="reader-btn" onclick="toggleReview()"><span data-i18n="reader.review">📋 回顧</span></button><button class="reader-hide-btn" id="reader-hide-btn" onclick="reader.toggleUI()">✕</button></div><div class="reader-area" id="reader-area"></div><div class="reader-dialog" id="reader-dialog"><div class="dialog-row"><img class="dialog-headicon" id="dialog-headicon"><div><div class="dialog-name" id="dialog-name"></div><div class="dialog-text" id="dialog-text"></div></div></div></div><div class="reader-controls"><button class="ctrl-btn" id="btn-auto" onclick="toggleAuto()" data-i18n="reader.auto">自動</button><button class="ctrl-btn" id="btn-skip" data-i18n="reader.skip">跳過</button><button class="ctrl-btn" onclick="prevLine()">▲</button><button class="ctrl-btn" onclick="nextLine()" data-i18n="reader.next">▼ 下一句</button></div><div class="review-overlay" id="review-overlay" onclick="if(event.target===this)toggleReview()"><div class="review-panel"><div class="review-header"><span data-i18n="review.title">對話回顧</span><button class="reader-btn" onclick="toggleReview()" data-i18n="review.close">關閉</button></div><div class="review-content" id="review-content"></div></div></div></div><script src="lib/pixi.min.js"></script><script src="lib/live2d.min.js"></script><script src="lib/live2dcubismcore.min.js"></script><script src="lib/pixi-live2d-display.min.js"></script><script src="js/live2d-renderer.js"></script><script src="js/novel-reader.js"></script><script src="js/app.js"></script></body></html>
